<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contato | Sou Leve</title>
<link rel="icon" href="img/soulevelogo.png" sizes="32x32" type="image/png">
<link rel="icon" href="img/soulevelogo.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="img/souleve.png" sizes="180x180">
<meta name="msapplication-TileImage" content="img/souleve.png">
<meta name="description" content="Fale com a Sou Leve. Tire dúvidas, envie sugestões ou solicite informações.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf8f2;
    --brand:#0f4f23;
    --brand-2:#0e855b;
    --text:#184739;
    --card:#f4fbf7;
    --line:#cfe8dc;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg)}
  .topbar{background:linear-gradient(90deg, #00b35b 0%, #005f32 100%);color:#fff;padding:18px 20px;position:static;top:0;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  .wrap{max-width:1100px;margin:auto;padding:0 20px}
  .brand{display:flex;align-items:center;gap:12px}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:linear-gradient(90deg,#20c19e,#0ea071);color:#fff;font-weight:700;text-decoration:none;cursor:pointer;box-shadow:0 8px 30px rgba(22,160,133,.28)}
  .hero{background:radial-gradient(800px 300px at 65% -50%, rgba(31,196,160,.25), transparent 60%),radial-gradient(900px 400px at -10% -60%, rgba(15,79,35,.08), transparent 60%);padding:42px 0 10px;}
  .hero h1{font-size:clamp(28px,4vw,40px);margin:18px 0 8px;color:var(--brand)}
  .hero p{margin:0 0 18px;color:#215c46}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 24px rgba(15,79,35,.08);padding:22px;display:grid;gap:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  label{display:grid;gap:6px;font-size:14px}
  input,textarea,select{appearance:none;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;background:#fff;color:#124235}
  input:focus,textarea:focus,select:focus{border-color:#20c19e;box-shadow:0 0 0 3px rgba(32,193,158,.15)}
  textarea{resize:vertical;min-height:130px}
  .inline-msg{display:none;margin-left:10px;font-weight:700}
  .ok{color:#0f4f23}
  .err{color:#8a1a1a}
  footer{margin-top:52px;background:var(--brand);color:#cfcfcf;border-top:1px solid rgba(255,255,255,.08)}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:22px 0}
  .foot a{color:#cfcfcf;text-decoration:none;margin-left:16px}
  .foot a:hover{text-decoration:underline}
/* ===== Efeito de hover moderno nos links do rodapé ===== */
footer a {
  color:#cfcfcf;
  text-decoration:none;
  position:relative;
  transition:color .2s ease;
  padding-bottom:3px;
}
footer a::after {
  content:'';
  position:absolute;
  left:0;
  bottom:-2px;
  width:0%;
  height:1px;
  background:#fff;
  transition:width .25s ease;
}
footer a:hover {
  color:#fff;
}
footer a:hover::after {
  width:100%;
}


</style>

</head>
<body>
<header class="topbar">
  <div class="wrap brand">
    <div id="home" aria-hidden="true"></div>
<a href="/#home">
    <img decoding="async"
         src="img/capa.png"
         alt="Sou Leve"
         style="width: 225px; height: auto; display: block;">
</a>
    </div>
  </div>
</header>
<section class="hero">
  <div class="wrap">
    <h1>Contato</h1>
    <p>Tem alguma dúvida, ideia ou sugestão? Envie sua mensagem e iremos te responder o quanto antes!</p>
  </div>
</section>
<section>
  <div class="wrap">
    <form id="contato" class="card" action="https://formsubmit.co/contato@gruposouleve.com.br" method="POST">
      <input type="hidden" name="_subject"  value="Contato – Site Sou Leve">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha"  value="false">
      <input type="hidden" name="_next"  id="next-url">
      <input type="hidden" name="_error" id="error-url">
      <input type="text" name="_honey" style="display:none">
      <div class="grid">
        <label><span>Nome completo *</span><input type="text" name="nome" required /></label>
        <label><span>E-mail *</span><input type="email" id="email" name="email" required autocomplete="email" pattern="^[^\s@]+@[^\s@]+\.[^\s@]{2,}$" oninvalid="this.setCustomValidity('Digite um e-mail válido (ex.: nome@dominio.com).')" oninput="this.setCustomValidity('')" /></label>
      </div>
      <div class="grid">
        <label><span>Telefone (opcional)</span><input type="tel" name="telefone" placeholder="(DDD) 9 9999-9999" /></label>
        <label><span>Assunto</span><select name="assunto"><option>Dúvidas gerais</option><option>Produtos Grupo | Sou Leve</option><option>Parcerias</option><option>Suporte</option></select></label>
      </div>
      <label><span>Mensagem *</span><textarea name="mensagem" rows="6" required placeholder="Conte como podemos te ajudar"></textarea></label>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <button type="submit" class="btn">Enviar mensagem</button>
        <span id="msg-ok"  class="inline-msg ok">Mensagem enviada com sucesso!</span>
        <span id="msg-err" class="inline-msg err">Algo deu errado. Tente novamente.</span>
      </div>
    </form>
  </div>
</section>
<footer style="
  background:#0f4f23;
  border-top:1px solid rgba(255,255,255,.08);
  color:#cfcfcf;
  padding:26px 0;
  font-family:Arial, Helvetica, sans-serif;
  font-size:15px;
  
  
">
  <div style="max-width:1100px;margin:auto;padding:0 20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">
      
      <!-- bloco do texto + instagram -->
      <div style="display:flex;align-items:center;gap:8px;">
        <span>© <span id="y"></span> Grupo | Sou Leve</span>
        <a href="https://www.instagram.com/souuleve" target="_blank" style="display:inline-flex;align-items:center;">
          <img src="img/instagram.png" alt="Instagram" style="width:22px;height:22px;filter:brightness(0) invert(1);transition:transform .2s;">
        </a>
      </div>

      <!-- links do rodapé -->
      <div style="display:flex;gap:18px;flex-wrap:wrap;">
        <a href="#home" style="color:#cfcfcf;text-decoration:none;">Home</a>
        <a href="ozenvitta/" style="color:#cfcfcf;text-decoration:none;">OzenVitta</a>
        <a href="ebook/" style="color:#cfcfcf;text-decoration:none;">Ebook Nutrição</a>
        <a href="#quem-somos" style="color:#cfcfcf;text-decoration:none;">Quem somos</a>
        <a href="privacidade/" style="color:#cfcfcf;text-decoration:none;">Privacidade</a>
      </div>
    </div>
  </div>
</footer>
<script>
(function () {
  document.getElementById('y').textContent = new Date().getFullYear();
  const here = location.origin + location.pathname;
  const next  = document.getElementById('next-url');
  const error = document.getElementById('error-url');
  if (next)  next.value  = here + '#ok';
  if (error) error.value = here + '#erro';
  const ok  = document.getElementById('msg-ok');
  const err = document.getElementById('msg-err');
  if (ok && err) {
    ok.style.display = 'none';
    err.style.display = 'none';
    if (location.hash === '#ok')   ok.style.display  = 'inline';
    if (location.hash === '#erro') err.style.display = 'inline';
    if (location.hash) history.replaceState(null, '', here);
  }
})();
</script>
</body>
</html>
